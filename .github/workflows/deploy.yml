name: Deploy to Server

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-app-trisonet
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Install sshpass
        run: sudo apt-get update -y && sudo apt-get install -y sshpass

      - name: SSH and Deploy
        run: |
          timeout 900 sshpass -p "${{ secrets.DEPLOY_PASSWORD }}" \
            ssh -o StrictHostKeyChecking=no -o ConnectTimeout=30 \
                -p "${{ secrets.DEPLOY_PORT }}" "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" '
            set -e
            pkill -f "app.trisonet.com/node_modules/.bin/next build" || true
            git config --global --add safe.directory /var/www/app.trisonet.com
            cd /var/www/app.trisonet.com
            git fetch origin main
            git reset --hard origin/main
            npm install
            rm -f .next/lock
            timeout 600 npm run build
            chown -R root:root .next
            cp -r .next/static .next/standalone/.next/static
            cp -r public .next/standalone/public
            pm2 restart trisonet-app
            pm2 save
          '
